version: '3.8'

services:
  # ─── RouteNex Standalone Gateway & Dashboard ─────────────────────────────
  # Unified Open Source AI Gateway & Web Dashboard running on a single port.
  routenex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routenex-gateway
    ports:
      - "${ROUTENEX_PORT:-3001}:3001"
    environment:
      - ROUTENEX_PORT=3001
      - ROUTENEX_HOST=0.0.0.0
      - ROUTENEX_MOCK_MODE=${ROUTENEX_MOCK_MODE:-true}
      - ROUTENEX_API_KEY=${ROUTENEX_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - ROUTENEX_DEFAULT_STRATEGY=${ROUTENEX_DEFAULT_STRATEGY:-balanced}
      - ROUTENEX_MAX_RETRIES=${ROUTENEX_MAX_RETRIES:-2}
      - ROUTENEX_TIMEOUT_MS=${ROUTENEX_TIMEOUT_MS:-60000}
      - ROUTENEX_PERSISTENCE=true
      - ROUTENEX_DB_PATH=/app/data/routenex.json
      - ROUTENEX_LOG_PROMPTS=false
    volumes:
      - routenex-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  routenex-data:
